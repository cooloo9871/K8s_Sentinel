# Helm values for Trivy Operator as K8s Sentinel installs it, into
# sentinel-system next to Sentinel itself. Used by deploy/install-job.yaml and
# deploy/install.sh; for a manual install:
#
#   helm install trivy-operator aqua/trivy-operator \
#     --namespace sentinel-system \
#     --values deploy/trivy-operator-values.yaml

operator:
  # Sentinel reads VulnerabilityReport and nothing else, so the other scanners
  # would only add load and reports nobody looks at. The infra assessment also
  # runs a node-collector pod with host access on every node, which the
  # restricted Pod Security level of sentinel-system does not admit.
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  sbomGenerationEnabled: false
  # One Trivy server holds the vulnerability database and the scan cache, and
  # the scan pods are its clients. Without it every scan pod downloads the
  # database for itself, and the containers of one scan pod, one per image of
  # the workload, compete for a single cache lock: the losers fail with "cache
  # may be in use by another process" and their images stay unscanned.
  builtInTrivyServer: true
  # The chart allows a scan 5 minutes, which pulling a large image over a slow
  # link does not fit in. A scan that runs out of time is removed without an
  # error in the operator's log, and the workload simply stays unscanned.
  scanJobTimeout: 15m

trivy:
  mode: ClientServer
  # Trivy's own limit, kept in step with scanJobTimeout above.
  timeout: 15m0s
  # The server keeps its database in an emptyDir and downloads it again after a
  # restart, so no StorageClass is needed.
  storageClassEnabled: false
  # The chart's 500M is not enough for a large image: the scan is OOM-killed.
  resources:
    limits:
      memory: 1Gi
  server:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# sentinel-system enforces the restricted Pod Security level. The chart's
# defaults already drop capabilities and forbid privilege escalation; these add
# the rest, for the operator and for the scan pods it starts.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

trivyOperator:
  # Sentinel's registry scan Jobs carry this label. They are Trivy scanning an
  # image; having the operator scan them in turn would be Trivy scanning Trivy.
  skipResourceByLabels: sentinel.io/registry-scan
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
