# K8s Sentinel installer Job
# Usage: kubectl apply -f deploy/install-job.yaml
# Logs:  kubectl logs -n kube-system job/sentinel-installer -f
# Clean: kubectl delete -f deploy/install-job.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-installer
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: sentinel-installer
    namespace: kube-system

---
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-installer
  namespace: kube-system
spec:
  ttlSecondsAfterFinished: 600   # auto-delete pod 10 min after completion
  template:
    spec:
      serviceAccountName: sentinel-installer
      restartPolicy: OnFailure
      containers:
        - name: installer
          image: quay.io/cooloo9871/helm-kubectl:3.17
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # ── Tetragon ────────────────────────────────────────────
              echo "[1/3] Tetragon"
              # In any namespace: one outside kube-system has cluster-wide
              # objects a second install collides with.
              if kubectl get daemonset -A -l app.kubernetes.io/name=tetragon -o name | grep -q .; then
                echo "  already installed, skipping"
              else
                echo "  installing via Helm..."
                helm repo add cilium https://helm.cilium.io --force-update
                helm repo update cilium
                # Sentinel collects events over the Tetragon gRPC API. That
                # API has no authentication, so it goes on the pod network
                # rather than the node's (hostNetwork=false), where the
                # NetworkPolicy applied below can limit it to Sentinel.
                helm install tetragon cilium/tetragon -n kube-system \
                  --set hostNetwork=false \
                  --set tetragon.grpc.address=0.0.0.0:54321
                echo "  waiting for DaemonSet..."
                kubectl rollout status daemonset/tetragon -n kube-system --timeout=120s
                echo "  ready"
              fi

              # No effect on a Tetragon that was already installed on the
              # host network; docs/install.md says how to move one.
              kubectl apply -f https://raw.githubusercontent.com/cooloo9871/K8s_Sentinel/main/deploy/tetragon-grpc-policy.yaml

              # ── K8s Sentinel ────────────────────────────────────────
              # One manifest, fetched directly. The namespace is in it, and
              # cloning the repository just to read one file needed git in the
              # image and pointed at a repository name that has since changed.
              echo "[2/3] Deploying K8s Sentinel"
              kubectl apply -f https://raw.githubusercontent.com/cooloo9871/K8s_Sentinel/main/deploy/sentinel.yaml
              kubectl rollout status deployment/sentinel \
                -n sentinel-system --timeout=120s

              # ── Trivy Operator ──────────────────────────────────────
              # Scans the images of running workloads; the Vulnerabilities
              # page reads its reports. It lives in sentinel-system, which
              # step 2 created, and comes last so a failure here leaves
              # Sentinel itself installed. The values switch off the scanners
              # Sentinel does not read and fit the pods to that namespace's
              # restricted Pod Security level.
              echo "[3/3] Trivy Operator"
              if kubectl get deployment -A -l app.kubernetes.io/name=trivy-operator -o name | grep -q .; then
                echo "  already installed, skipping"
              else
                echo "  installing via Helm..."
                helm repo add aqua https://aquasecurity.github.io/helm-charts/ --force-update
                helm repo update aqua
                helm install trivy-operator aqua/trivy-operator -n sentinel-system \
                  -f https://raw.githubusercontent.com/cooloo9871/K8s_Sentinel/main/deploy/trivy-operator-values.yaml
                echo "  waiting for Deployment..."
                kubectl rollout status deployment/trivy-operator -n sentinel-system --timeout=180s
                echo "  ready"
              fi

              echo ""
              echo "Done. Access K8s Sentinel:"
              echo "  kubectl port-forward -n sentinel-system svc/sentinel 8080:80"

              # Last, because nothing after it can talk to the API: the
              # installer gives up cluster-admin instead of leaving a
              # ServiceAccount with it in kube-system for good.
              kubectl delete clusterrolebinding sentinel-installer --ignore-not-found
