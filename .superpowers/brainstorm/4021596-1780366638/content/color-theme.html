<h2>整體配色主題</h2>
<p class="subtitle">深色 Sidebar 確定，但內容區域要用哪種底色？</p>

<div class="cards" style="grid-template-columns: repeat(2, 1fr); gap: 2rem; margin-top: 1.5rem;">

  <!-- Option A: Dark sidebar + Light content (NeuVector default) -->
  <div class="card" data-choice="mixed" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:0.75rem; background:#e8eaed; border-radius:6px 6px 0 0;">
      <div style="display:flex; flex-direction:column; gap:0.4rem; height:200px;">
        <!-- Header -->
        <div style="background:#1b2a3b; border-radius:4px; height:16px; display:flex; align-items:center; padding:0 0.5rem; gap:0.3rem;">
          <div style="background:#2d7dd2; height:5px; width:24px; border-radius:2px;"></div>
          <div style="flex:1;"></div>
          <div style="background:#ffffff33; height:5px; width:10px; border-radius:50%;"></div>
        </div>
        <div style="display:flex; gap:0.4rem; flex:1;">
          <!-- Sidebar -->
          <div style="width:30%; background:#1b2a3b; border-radius:4px; padding:0.5rem; display:flex; flex-direction:column; gap:0.3rem;">
            <div style="background:#2d7dd2; height:4px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff33; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
          </div>
          <!-- Light content area -->
          <div style="flex:1; background:#f5f6fa; border-radius:4px; padding:0.4rem; display:flex; flex-direction:column; gap:0.3rem;">
            <div style="background:#e0e3eb; border-radius:3px; height:10px; width:50%;"></div>
            <div style="background:#ffffff; border-radius:3px; flex:1; border:1px solid #dee2e6;"></div>
            <div style="display:flex; gap:0.3rem;">
              <div style="background:#2d7dd2; border-radius:3px; height:8px; flex:1;"></div>
              <div style="background:#6c757d; border-radius:3px; height:8px; flex:1;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A — 深色 Sidebar + 淺色內容區</h3>
      <p>與 NeuVector 預設主題完全一致：深海軍藍導覽列，淺灰白內容區，表格清晰易讀，適合長時間操作</p>
    </div>
  </div>

  <!-- Option B: Full dark theme -->
  <div class="card" data-choice="full-dark" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:0.75rem; background:#0d1117; border-radius:6px 6px 0 0;">
      <div style="display:flex; flex-direction:column; gap:0.4rem; height:200px;">
        <!-- Header -->
        <div style="background:#161b22; border-radius:4px; height:16px; display:flex; align-items:center; padding:0 0.5rem; gap:0.3rem; border-bottom:1px solid #30363d;">
          <div style="background:#238636; height:5px; width:24px; border-radius:2px;"></div>
          <div style="flex:1;"></div>
          <div style="background:#8b949e; height:5px; width:10px; border-radius:50%;"></div>
        </div>
        <div style="display:flex; gap:0.4rem; flex:1;">
          <!-- Sidebar dark -->
          <div style="width:30%; background:#0d1117; border-radius:4px; padding:0.5rem; display:flex; flex-direction:column; gap:0.3rem; border-right:1px solid #30363d;">
            <div style="background:#238636; height:4px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff33; height:3px; border-radius:2px;"></div>
            <div style="background:#ffffff22; height:3px; border-radius:2px;"></div>
          </div>
          <!-- Dark content area -->
          <div style="flex:1; background:#161b22; border-radius:4px; padding:0.4rem; display:flex; flex-direction:column; gap:0.3rem; border:1px solid #30363d;">
            <div style="background:#21262d; border-radius:3px; height:10px; width:50%;"></div>
            <div style="background:#0d1117; border-radius:3px; flex:1; border:1px solid #30363d;"></div>
            <div style="display:flex; gap:0.3rem;">
              <div style="background:#238636; border-radius:3px; height:8px; flex:1;"></div>
              <div style="background:#6e7681; border-radius:3px; height:8px; flex:1;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B — 全深色主題</h3>
      <p>Sidebar 與內容區皆為深色，視覺一致性強，適合機房／暗室環境，但表格資料閱讀難度略高</p>
    </div>
  </div>

</div>

<p class="subtitle" style="margin-top:1rem;">請點選偏好的配色，或在終端機回答 A / B</p>
