<h2>版面佈局選擇</h2>
<p class="subtitle">NeuVector 風格的企業資安 console 通常採用哪種導覽結構？</p>

<div class="cards" style="grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1.5rem;">

  <div class="card" data-choice="sidebar-dark" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1a2332; padding:0.75rem; border-radius:6px 6px 0 0;">
      <div style="display:flex; gap:0.5rem; height:160px;">
        <!-- Sidebar -->
        <div style="width:36%; background:#0f1923; border-radius:4px; padding:0.5rem;">
          <div style="background:#2d7dd2; height:6px; border-radius:3px; margin-bottom:0.5rem;"></div>
          <div style="background:#ffffff22; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ffffff22; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#2d7dd2; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ffffff22; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ffffff22; height:4px; border-radius:2px;"></div>
        </div>
        <!-- Content -->
        <div style="flex:1; display:flex; flex-direction:column; gap:0.4rem;">
          <div style="background:#1e2d3d; border-radius:4px; height:14px;"></div>
          <div style="background:#1e2d3d; border-radius:4px; flex:1;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>深色左側邊欄</h3>
      <p>固定深色 sidebar + 頂部 header，與 NeuVector / CoreUI 完全一致，適合多層導覽</p>
    </div>
  </div>

  <div class="card" data-choice="sidebar-light" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f0f2f5; padding:0.75rem; border-radius:6px 6px 0 0;">
      <div style="display:flex; gap:0.5rem; height:160px;">
        <!-- Sidebar -->
        <div style="width:36%; background:#ffffff; border-radius:4px; padding:0.5rem; border:1px solid #e0e0e0;">
          <div style="background:#3c7be1; height:6px; border-radius:3px; margin-bottom:0.5rem;"></div>
          <div style="background:#ddd; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ddd; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#3c7be1; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ddd; height:4px; border-radius:2px; margin-bottom:0.3rem;"></div>
          <div style="background:#ddd; height:4px; border-radius:2px;"></div>
        </div>
        <!-- Content -->
        <div style="flex:1; display:flex; flex-direction:column; gap:0.4rem;">
          <div style="background:#e0e0e0; border-radius:4px; height:14px;"></div>
          <div style="background:#ffffff; border-radius:4px; flex:1; border:1px solid #e0e0e0;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>淺色左側邊欄</h3>
      <p>白色 sidebar + 淺灰底，視覺清爽，適合白天操作環境，比較偏 admin 工具風</p>
    </div>
  </div>

  <div class="card" data-choice="topnav" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f0f2f5; padding:0.75rem; border-radius:6px 6px 0 0;">
      <div style="display:flex; flex-direction:column; gap:0.4rem; height:160px;">
        <!-- Top nav -->
        <div style="background:#1a2332; border-radius:4px; height:18px; display:flex; align-items:center; padding:0 0.4rem; gap:0.3rem;">
          <div style="background:#2d7dd2; height:4px; width:20px; border-radius:2px;"></div>
          <div style="background:#ffffff44; height:4px; width:15px; border-radius:2px;"></div>
          <div style="background:#ffffff44; height:4px; width:15px; border-radius:2px;"></div>
          <div style="background:#ffffff44; height:4px; width:15px; border-radius:2px;"></div>
        </div>
        <!-- Content -->
        <div style="flex:1; background:#ffffff; border-radius:4px; border:1px solid #e0e0e0;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>頂部導覽列</h3>
      <p>單層水平 navbar，畫面空間最大，但功能多時不易展開，適合頁面少的應用</p>
    </div>
  </div>

</div>

<p class="subtitle" style="margin-top:1rem;">請點選偏好的版面，或在終端機直接回答</p>
